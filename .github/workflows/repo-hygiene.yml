name: Repo Hygiene

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
  schedule:
    # 01:00 Asia/Shanghai equals 17:00 UTC on the previous day.
    - cron: "0 17 * * *"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repository smoke checks
        run: python scripts/validate_repo.py

      - name: Run validation regression tests
        run: python -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Verify Windows entry point and runner evidence gates
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\scripts\validate_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\test_runner.ps1 -OutputDirectory "$env:RUNNER_TEMP\dwsim-runner-checks"
          exit $LASTEXITCODE
